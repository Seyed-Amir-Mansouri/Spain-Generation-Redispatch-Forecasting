[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "congestion_es"
version = "0.1.0"
description = "Hourly location of congestion redispatch in the Spanish peninsular grid"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "entsoe-py>=0.8",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
congestion-es = "congestion_es.cli:main"

[tool.setuptools]
packages = ["congestion_es"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
