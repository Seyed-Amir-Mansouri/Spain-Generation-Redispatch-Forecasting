[paths]
registry_dir = "data/raw/registry"
plants_dir = "data/raw/plants"
redispatch_dir = "data/raw/i90_qh"
market = "data/raw/market_qh.csv"
constraints = "data/raw/constraints_qh.csv"
weather = "data/raw/weather_qh.csv"
unit_locations = "data/processed/unit_locations.csv"
manual_locations = "reference/manual_locations.csv"
unit_aliases = "reference/unit_aliases.csv"
model_dir = "models"
predictions = "outputs/predictions.csv"
validation = "outputs/validation_history.csv"
hourly_redispatch_dir = "data/raw/i90"
hourly_market = "data/raw/market.csv"
hourly_constraints = "data/raw/constraints.csv"
hourly_weather = "data/raw/weather.csv"

# start is the first day of 15-minute data; hourly data from hourly_start is split into quarters
[data]
start = "2025-10-01"
hourly_start = ""

[esios]
request_interval_seconds = 6

[areas]
cell_degrees = 0.5
min_located_mw = 50
estimate_unplaced = true
estimate_top_cells = 1

# Open-Meteo weather grid
[weather]
grid_degrees = 1.0
points_per_request = 10
request_interval_seconds = 5

[labels]
direction = "Bajar"
restriction_types = ["SCB", "SCA", "RTD"]
min_mwh = 1.25
settle_days = 90

[features]
history_days = 28
event_lag_days = 91
use_ida3 = true

# REE e-sios indicator ids
[constraint_indicators]
down_overload_base = 1791
down_overload_contingency = 1793
down_distribution = 1797
down_voltage = 1795
down_other = 1801
phase1_up_total = 701
phase1_down_total = 702

[model]
test_days = 60
threshold = 0.5
learning_rate = 0.05
max_iter = 300
max_leaf_nodes = 31
random_state = 42
negative_fraction = 0.25

[validation]
window_days = 14
min_skill = 0.0
