[paths]
registry_dir = "data/raw/registry"
plants_dir = "data/raw/plants"
redispatch_dir = "data/raw/i90_qh"
market = "data/raw/market_qh.csv"
constraints = "data/raw/constraints_qh.csv"
schedule = "data/raw/pbf_qh.csv"
weather = "data/raw/weather_spots_qh.csv"
generation_dir = "data/raw/entsoe_units"
unit_locations = "data/processed/unit_locations.csv"
manual_locations = "reference/manual_locations.csv"
unit_aliases = "reference/unit_aliases.csv"
unit_list = "reference/entsoe_units.csv"
generation_plants = "reference/entsoe_plants.csv"
model_dir = "models"
predictions = "outputs/redispatch_decisions.csv"
validation = "outputs/decision_validation.csv"
backtest = "outputs/backtest_decisions.csv"

# start is the first day of 15-minute data
[data]
start = "2025-10-01"

[esios]
request_interval_seconds = 6

# a programming unit gets predictions when it was redispatched up or down in at least min_events quarter-hours before the held-out days
# and, when location_confidence is set, every one of its physical units was located with that confidence,
# and, when use_list is set, it is in paths.unit_list (the 41 units ENTSO-E reports actual output for)
[units]
min_events = 50
location_confidence = "high"
use_list = true

# ENTSO-E actual output per unit; inputs use only what is out before a day-ahead prediction at noon:
# the whole day two days before, and the day before up to quarter known_until_period.
# A plant is the units of one technology within plant_degrees.
[generation]
request_interval_seconds = 6
known_until_period = 48
plant_degrees = 0.1

# Open-Meteo weather at the spots of the wind and solar units, averaged over square areas;
# calls_per_hour keeps requests under Open-Meteo's free limit of 5,000 weighted calls an hour
[weather]
spot_degrees = 0.1
area_degrees = 2.0
points_per_request = 5
request_interval_seconds = 5
calls_per_hour = 4000

[labels]
directions = ["Bajar", "Subir"]
min_mwh = 1.25
settle_days = 90

# I90 restriction codes counted per direction
[labels.restriction_types]
Bajar = ["SCB", "SCA", "RTD", "EST", "CEX", "PEV", "COT"]
Subir = ["SCB", "SCA", "RTD", "COT", "SOT", "RSI", "DAN", "PCB"]

[features]
use_ida3 = true

# REE e-sios indicator ids
[constraint_indicators]
down_overload_base = 1791
down_overload_contingency = 1793
down_distribution = 1797
down_voltage = 1795
down_other = 1801
phase1_up_total = 701
phase1_down_total = 702
up_overload_base = 1790
up_overload_contingency = 1792
up_voltage = 1794
up_distribution = 1796
up_other = 1800
up_security = 2352

# REE e-sios indicator ids of Spain's day-ahead schedule (PBF) per technology, published the afternoon before delivery
[schedule_indicators]
pbf_combined_cycle = 9
pbf_nuclear = 4
pbf_wind = 12
pbf_solar_pv = 14
pbf_solar_thermal = 15
pbf_hydro = 1
pbf_pumped_generation = 3
pbf_pumped_consumption = 25
pbf_import_france = 28
pbf_export_france = 32
pbf_import_portugal = 29
pbf_export_portugal = 33
pbf_cogeneration = 17

# one LightGBM yes/no model per direction; a unit-quarter is called up or down when that model's probability is the higher one and reaches threshold
[model]
test_days = 60
threshold = 0.5
learning_rate = 0.05
n_estimators = 600
num_leaves = 63
reg_lambda = 1.0
min_child_samples = 100
max_cat_threshold = 64
random_state = 42
negative_fraction = 0.25
recency_half_life_days = 60

# settings that differ per direction
[model.Bajar]
n_estimators = 1200
cat_smooth = 50
cat_l2 = 10
min_data_per_group = 200

[validation]
window_days = 14
min_skill = 0.0
