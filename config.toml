[paths]
registry_dir = "data/raw/registry"
plants_dir = "data/raw/plants"
redispatch_dir = "data/raw/i90_qh"
market = "data/raw/market_qh.csv"
constraints = "data/raw/constraints_qh.csv"
weather = "data/raw/weather_qh.csv"
unit_locations = "data/processed/unit_locations.csv"
manual_locations = "reference/manual_locations.csv"
unit_aliases = "reference/unit_aliases.csv"
model_dir = "models"
predictions = "outputs/redispatch_predictions.csv"
validation = "outputs/validation_history.csv"
hourly_redispatch_dir = "data/raw/i90"
hourly_market = "data/raw/market.csv"
hourly_constraints = "data/raw/constraints.csv"
hourly_weather = "data/raw/weather.csv"

# start is the first day of 15-minute data; set hourly_start to also use earlier hourly data split into quarters
[data]
start = "2025-10-01"

[esios]
request_interval_seconds = 6

# a programming unit gets predictions when it was redispatched in at least min_events quarter-hours before the held-out days
[units]
min_events = 50

# Open-Meteo weather grid
[weather]
grid_degrees = 1.0
points_per_request = 10
request_interval_seconds = 5

[labels]
directions = ["Bajar", "Subir"]
min_mwh = 1.25
settle_days = 90

# I90 restriction codes counted per direction
[labels.restriction_types]
Bajar = ["SCB", "SCA", "RTD", "EST", "CEX", "PEV", "COT"]
Subir = ["SCB", "SCA", "RTD", "COT", "SOT", "RSI", "DAN", "PCB"]

[features]
use_ida3 = true

# REE e-sios indicator ids
[constraint_indicators]
down_overload_base = 1791
down_overload_contingency = 1793
down_distribution = 1797
down_voltage = 1795
down_other = 1801
phase1_up_total = 701
phase1_down_total = 702
up_overload_base = 1790
up_overload_contingency = 1792
up_voltage = 1794
up_distribution = 1796
up_other = 1800
up_security = 2352

[model]
test_days = 60
threshold = 0.8
learning_rate = 0.05
max_iter = 600
max_leaf_nodes = 63
l2_regularization = 1.0
min_samples_leaf = 100
random_state = 42
negative_fraction = 0.25
recency_half_life_days = 60

[validation]
window_days = 14
min_skill = 0.0
